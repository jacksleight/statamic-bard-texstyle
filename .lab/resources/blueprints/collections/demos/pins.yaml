title: Pins
fields:
  -
    handle: title
    field:
      type: text
      display: Title
      required: true
      validate:
        - required
  -
    handle: content
    field:
      type: bard
      display: Article
      container: assets
      link_collections:
        - demos
      remove_empty_nodes: false
      bts_defaults: demo
      bts_pins:
        - glyph
        - note
        - rating
        - tide
      buttons:
        - bts_pins
        - h1
        - h2
        - h3
        - bts_paragraph
        - unorderedlist
        - bold
        - italic
        - anchor
