title: Styles
fields:
  -
    handle: title
    field:
      type: text
      display: Title
      required: true
      validate:
        - required
  -
    handle: content
    field:
      type: bard
      display: Article
      container: assets
      link_collections:
        - demos
      remove_empty_nodes: false
      bts_defaults: demo
      buttons:
        - headline
        - h1
        - h2
        - h3
        - bts_paragraph
        - standfirst
        - unorderedlist
        - tick_list
        - orderedlist
        - steps
        - highlight
        - tip
        - bold
        - italic
        - anchor
        - button_link
